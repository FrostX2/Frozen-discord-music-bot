<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0e1e">
<title>FuriMusic - Admin Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <span class="logo-text">FuriMusic</span>
      <span class="version-badge js-version">v&ndash;</span>
    </div>
    <div class="topbar-right">
      <span class="status-pill"><span class="status-dot" id="topbarDot"></span><span id="topbarStatus">Loading...</span></span>
      <a href="/" class="btn btn-ghost btn-sm">Public Page</a>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="page-content" id="pageContent">
    <div class="loading-spinner">Loading...</div>
  </main>
</div>

<script src="/app.js"></script>
</body>
</html>
